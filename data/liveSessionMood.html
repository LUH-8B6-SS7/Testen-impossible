<div id="liveSessionMood" class="card">
    <h2>Stimmungsbarometer</h2>

    <div id="moodGrid" class="stimmung-grid">
        <button id="tooSlow" class="highlight stimmung-btn">😴 <br> 
            Zu langsam</button>
        <button id="tooFast" class="highlight stimmung-btn">😵‍💫 <br> 
            Zu schnell</button>
        <button id="repeating" class="highlight stimmung-btn">🤓 <br> 
            Hatten wir schon</button>
        <button id="repeat" class="highlight stimmung-btn">🤔 <br> 
            Nochmal bitte</button>
    </div>


    <div id="moodDiagramm">
        <div class="moodDiagrammLable" style="grid-row: 1; grid-column: 1;">Zu langsam</div>
        <div id="moodDiagrammBar0" class="moodDiagrammBar" style="grid-row: 1; grid-column: 2;"></div>

        <div class="moodDiagrammLable" style="grid-row: 2; grid-column: 1;">Zu schnell</div>
        <div id="moodDiagrammBar1" class="moodDiagrammBar" style="grid-row: 2; grid-column: 2;"></div>

        <div class="moodDiagrammLable" style="grid-row: 3; grid-column: 1;">Hatten wir schon</div>
        <div id="moodDiagrammBar2" class="moodDiagrammBar" style="grid-row: 3; grid-column: 2;"></div>

        <div class="moodDiagrammLable" style="grid-row: 4; grid-column: 1;">Nochmal bitte</div>
        <div id="moodDiagrammBar3" class="moodDiagrammBar" style="grid-row: 4; grid-column: 2;"></div>
    </div>

</div>
