<div id="courseList" class="card">
    <table id="courseListTable">
        <tr id="courseListTableHead">
            <th>Kurse</th>
        </tr>

    </table>
    <div id="addCourse">
        <button id="addCourseButton" class="button" style="background-color: green;" onclick="addCourseDialogOpen()">+ Hinzufügen</button>
    </div>
</div>


<div id="addCourseDialog" class="card cardEnter absoluteCenter unblurred" style="display: none; z-index: 1;">
    <input type="text" id="newCourseName" placeholder="Kursnamen" style="grid-row: 1;">
    <div class="unblurred" style="white-space: nowrap; grid-row: 2;">
        <button id="addCourseButton" class="button" style="background-color: green;" onclick="addCourse()">Hinzufügen</button>
        <button id="cancleCourseButton" class="button" style="background-color: red;" onclick="addCourseDialogClose()">Abbrechen</button>
    </div>
</div>
